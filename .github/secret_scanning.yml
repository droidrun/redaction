# Secret scanning: paths that hold synthetic secrets on purpose (test vectors, corpora, fixtures). None of these
# values is a credential; they exist to show what the redaction rules find.
paths-ignore:
  - "spec/corpus/**"
  - "spec/vectors/**"
  - "go/spec/**"
  - "python/src/droidrun_redaction/spec/**"
  - "go/testdata/**"
  - "**/*.test.ts"
  - "python/tests/**"
  - "ts/src/**/*.fixture.ts"
