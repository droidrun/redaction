name: Letter table

# The letter table of the spec is generated from UnicodeData.txt 15.0.0 on unicode.org (SHA-256 pinned in the
# generator). Pull request CI relies on the committed table and the spec hash; this workflow checks the table
# against the download once a week and on demand, and the publish workflow checks it on a release.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  letters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Letter table is the Unicode 15.0.0 table
        run: bun tools/gen-letters.ts --check
