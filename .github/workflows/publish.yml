name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # pushes the Go tag go/vX.Y.Z
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: The tag is the version of npm, Python and Go (all three are equal)
        working-directory: .
        run: tools/release-version --check "$GITHUB_REF_NAME"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          registry-url: https://npm.pkg.github.com
          scope: '@droidrun'
      - name: Spec copies and hash match the spec on the tagged commit
        working-directory: .
        run: tools/sync-spec --check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install tools
        working-directory: tools
        run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Lint spec on the tagged commit
        working-directory: .
        run: bun tools/lint-spec.ts
      - name: Letter table is the Unicode 15.0.0 table (UnicodeData.txt checked against a pinned SHA-256)
        working-directory: .
        run: bun tools/gen-letters.ts --check
      - name: Pack and import from the tarball
        working-directory: .
        run: bun tools/check-pack.ts
      - name: Tag the Go module on the same commit (go/vX.Y.Z; a re-run finds the tag and goes on)
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go_tag="go/$GITHUB_REF_NAME"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          existing=$(git ls-remote "$remote" "refs/tags/$go_tag" | cut -f1)
          if [ -z "$existing" ]; then
            git push "$remote" "$GITHUB_SHA:refs/tags/$go_tag"
          elif [ "$existing" != "$GITHUB_SHA" ]; then
            echo "the tag $go_tag exists on another commit" >&2
            exit 1
          fi
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
