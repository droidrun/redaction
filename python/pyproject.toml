[project]
name = "droidrun-redaction"
version = "0.3.0"
description = "Secret redaction for text and JSON values (Python implementation of the redaction spec)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/droidrun/redaction"
Repository = "https://github.com/droidrun/redaction"
Issues = "https://github.com/droidrun/redaction/issues"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "droidrun_redaction"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.uv]
# The newest upload time the lock may use (uv lock --exclude-newer): a package must be a week old.
exclude-newer = "2026-11-11T07:50:03Z"
